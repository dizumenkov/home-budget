<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Категории и метки</title>

<link rel="stylesheet" href="/static/buttons.css">
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/categories.css">
</head>
<body>
<header>
  <h1>Категории и метки <a href="/">← к чекам</a></h1>
</header>

<main>
  <div class="card">
    <div class="new-root">
      <label>Новая категория:</label>
      <input type="text" id="new-root-name" placeholder="например, Продукты">
      <button id="new-root-btn">+ Создать</button>
    </div>
  </div>

  <div class="card">
    <ul class="tree" id="tree"></ul>
    <div class="empty-state" id="empty-state" hidden>
      Пока нет ни одной категории. Создайте первую выше.
    </div>
  </div>

  <div id="status"></div>
</main>


<script src="/static/common.js" defer></script>
<script src="/static/categories.js" defer></script>
</body>
</html>
